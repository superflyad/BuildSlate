routing_groups:
  memory:
    endpoints: [compute_soc, memory_a_32gb, memory_b_32gb, memory_c_32gb, memory_d_32gb]
    rule: supplier_reference_design_required_for_channel_assignment_escape_and_matching
    risk: critical
  storage:
    endpoints: [compute_soc, storage_ufs_1tb_reference]
    rule: host_support_and_interface_generation_must_match_selected_device
    risk: high
  platform_power:
    endpoints: [battery_charger, platform_pmic, compute_soc, memory_a_32gb, memory_b_32gb, memory_c_32gb, memory_d_32gb]
    rule: wide_copper_planes_and_frequency_domain_pdn_review_required
    risk: critical
  external_interfaces:
    endpoints: [compute_soc, usb_pd_controller, wifi_bluetooth, security_controller]
    rule: connector_flex_rf_and_security_partitioning_required
    risk: high

layer_stack:
  assumed_total_layers: 12
  assumed_finished_thickness_mm: 0.8
  layers:
    - {id: L1, role: component_and_short_signal}
    - {id: L2, role: solid_reference_plane}
    - {id: L3, role: high_speed_signal}
    - {id: L4, role: power_plane}
    - {id: L5, role: high_speed_signal}
    - {id: L6, role: solid_reference_plane}
    - {id: L7, role: solid_reference_plane}
    - {id: L8, role: high_speed_signal}
    - {id: L9, role: power_plane}
    - {id: L10, role: high_speed_signal}
    - {id: L11, role: solid_reference_plane}
    - {id: L12, role: component_and_short_signal}
  via_strategy:
    assumed: stacked_or_staggered_laser_microvias_with_buried_vias
    status: fabrication_partner_review_required
    forbidden_assumption: via_structure_is_not_yet_qualified_for_yield_or_reliability

missing_release_inputs:
  - Platform package drawing, ball map, reference schematic, rail map, and power sequence.
  - Qualified memory part numbers, package drawings, channel topology, and placement rules.
  - Storage host support, package selection, pin map, power, and thermal limits.
  - Display, camera, RF, USB, charging, security, debug, and factory-test interfaces.
  - Controlled-impedance stackup, loss budget, via coupons, fabrication rules, and assembly limits.
  - Schematic, preliminary netlist, constraints, escape study, SI/PI simulation, and layout review.
