required_pack_cad_inputs:
  - Cell body and active-material dimensions at beginning and end of life.
  - Tab geometry and bend radius.
  - Protection circuit, fusing, sensing, and connector or weld zones.
  - Swelling allowance across cycle life and temperature.
  - Adhesive, restraint, puncture protection, insulation, and enclosure clearance.
  - Charge and discharge thermal paths.

