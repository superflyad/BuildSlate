      <stop offset="0" stop-color="#0b131e" />
      <stop offset="1" stop-color="#152538" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183347" stop-opacity=".85" />
      <stop offset="1" stop-color="#0d1c2a" stop-opacity=".5" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#87b0c1" stroke-opacity=".08" stroke-width="1" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="500" rx="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
