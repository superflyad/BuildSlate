metadata:
  status: planned_not_executed
  result_schema: validation/evt0/schemas/test-result.schema.yaml
  manifest_schema: validation/evt0/schemas/run-manifest.schema.yaml

global_pass_fail:
  hard_stops:
    maximum_skin_c: 43.0
    battery_limit: lower_of_supplier_limit_and_40c_pre_supplier_abort
    unexpected_resets: 0
    unhandled_protection_faults: 0
    sensor_faults_affecting_safety: 0
  evidence_quality:
    required_channels_present: true
    calibration_current: true
    raw_data_linked: true
    configuration_hash_match: true
    workload_hash_match: true
  decision_rule: Any hard-stop or evidence-quality failure blocks the test and EVT0 gate; performance misses create a requirement-trade record.

sequence:
  - {id: B00, test: incoming_inspection_and_mass, state: blocked_on_selected_components, workload: none, purpose: identity_dimensions_mass_damage_and_traceability}
  - {id: B01, test: build_traveler_and_electrical_safety_review, state: blocked_on_build, workload: none, purpose: assembly_inspection_isolation_ground_and_protection_checks}
  - {id: F00, test: boot_telemetry_and_radio_kill, state: blocked_on_build, workload: W00_idle_baseline, purpose: functional_baseline_security_and_fault_logging}
  - {id: I20, test: integrated_local_interfaces, state: blocked_on_selected_interfaces_and_firmware, workload: none, purpose: measure_display_touch_camera_audio_and_usb_activity_on_one_serialized_unit}
  - {id: P00, test: idle_power_and_thermal_stabilization, state: blocked_on_build, workload: W00_idle_baseline, purpose: establish_baseline_and_sensor_sanity}
  - {id: P10, test: controlled_compute_power_ramp, state: blocked_on_build, workload: W10_ai_reference_70b_4bit, purpose: find_safe_sustained_envelope_without_assuming_28w}
  - {id: P11, test: peak_burst_and_rail_transient, state: blocked_on_P10, workload: W11_ai_peak_burst, purpose: measure_droop_response_and_recovery_within_approved_peak_duration}
  - {id: M20, test: memory_capacity_bandwidth_and_stability, state: blocked_on_build, workload: W20_memory_capacity_and_bandwidth, purpose: prove_128gb_fallback_behavior}
  - {id: S30, test: storage_sustained_io_and_thermal, state: blocked_on_selected_storage, workload: W30_storage_sustained_io, purpose: characterize_one_tb_baseline_and_host_behavior}
  - {id: C40, test: combined_system_sustained, state: blocked_on_component_tests, workload: W40_combined_ai_storage_display, purpose: measure_coupled_performance_per_watt_and_throttling}
  - {id: T10, test: open_air_25c_thermal_map, state: blocked_on_thermal_mule, workload: W10_ai_reference_70b_4bit, purpose: correlate_primary_sustained_case}
  - {id: T20, test: hot_ambient_35c_control_ramp, state: blocked_on_T10, workload: W10_ai_reference_70b_4bit, purpose: verify_throttle_before_skin_or_battery_limit}
  - {id: T30, test: handheld_fixture, state: blocked_on_T10, workload: W10_ai_reference_70b_4bit, purpose: map_grip_temperature_and_control_response}
  - {id: T40, test: pocket_bag_fault_containment, state: prohibited_until_controls_validated, workload: none, purpose: verify_high_power_and_charging_inhibition_only}
  - {id: B40, test: battery_runtime_at_validated_sustained_load, state: blocked_on_selected_pack_and_P10, workload: W10_ai_reference_70b_4bit, purpose: measure_runtime_discharge_temperature_and_energy}
  - {id: B50, test: wired_charge_at_EVT_cap, state: blocked_on_selected_pack_charger_and_charge_plan, workload: W00_idle_baseline, purpose: measure_charge_curve_losses_temperatures_and_protection}
  - {id: B51, test: charging_overlap_guard, state: prohibited_until_controls_validated, workload: control_verification_only, purpose: prove_full_power_charge_and_sustained_AI_cannot_coexist}
  - {id: R50, test: modular_radio_coexistence, state: blocked_on_radio_mule, workload: W50_radio_coexistence_traffic, purpose: detect_desense_EMC_and_performance_coupling}
  - {id: MC0, test: model_correlation_and_residual_review, state: blocked_on_required_measurements, workload: none, purpose: compare_mechanical_power_thermal_and_runtime_models_to_data}

required_for_evt0_evidence_gate: [B00, B01, F00, I20, P00, P10, P11, M20, S30, C40, T10, T20, T30, B40, B50, R50, MC0]
explicitly_not_required_because_removed_or_deferred: [wireless_charging, cellular, 512gb_memory, 4tb_storage]

channel_requirements:
  B00: [configuration]
  B01: [configuration, electrical_slow]
  F00: [configuration, platform]
  I20: [configuration, electrical_slow, platform]
  P00: [configuration, electrical_slow, thermal, platform]
  P10: [configuration, electrical_slow, electrical_transient, thermal, platform, workload]
  P11: [configuration, electrical_transient, platform, workload]
  M20: [configuration, electrical_slow, platform, workload]
  S30: [configuration, electrical_slow, platform, workload]
  C40: [configuration, electrical_slow, electrical_transient, thermal, platform, workload]
  T10: [configuration, electrical_slow, thermal, platform, workload]
  T20: [configuration, electrical_slow, thermal, platform, workload]
  T30: [configuration, electrical_slow, thermal, platform, workload]
  T40: [configuration, electrical_slow, thermal, platform]
  B40: [configuration, electrical_slow, thermal, platform, workload]
  B50: [configuration, electrical_slow, thermal, platform]
  B51: [configuration, electrical_slow, thermal, platform]
  R50: [configuration, electrical_slow, platform, workload]
  MC0: [configuration]

# A passing run needs these columns in one hash-verified, time-aligned CSV.
# Values establish observed activity and data completeness, not supplier-specific
# acceptance limits or physical authenticity. Reviewers retain final disposition.
objective_measurements:
  B00:
    required_columns: [elapsed_s, mass_g, length_mm, width_mm, thickness_mm]
    positive_columns: [mass_g, length_mm, width_mm, thickness_mm]
    physical_maximum_columns: {mass_g: 350, length_mm: 180, width_mm: 95, thickness_mm: 9.5}
    analysis_artifacts_min: 1
  B01:
    required_columns: [elapsed_s, build_inspection_pass, electrical_safety_review_pass, protection_check_pass]
    one_columns: [build_inspection_pass, electrical_safety_review_pass, protection_check_pass]
    analysis_artifacts_min: 1
  F00:
    required_columns: [elapsed_s, boot_complete, radio_kill_confirmed, unexpected_resets, protection_faults]
    one_columns: [boot_complete, radio_kill_confirmed]
    zero_columns: [unexpected_resets, protection_faults]
  I20:
    required_columns: [elapsed_s, display_frames, touch_events, camera_frames, audio_playback_samples, audio_capture_samples, usb_bytes_tx, usb_bytes_rx]
    positive_deltas: [display_frames, touch_events, camera_frames, audio_playback_samples, audio_capture_samples, usb_bytes_tx, usb_bytes_rx]
  P00:
    required_columns: [elapsed_s, system_power_w, battery_voltage_v, TC_REAR_SOC, TC_FRONT_SOC, TC_REAR_BATTERY, T_AMBIENT]
    positive_columns: [system_power_w, battery_voltage_v]
    minimum_duration_s: 1800
  P10:
    required_columns: [elapsed_s, system_power_w, work_units_completed, compute_rail_voltage_v, compute_rail_current_a, TC_REAR_SOC, TC_FRONT_SOC, TC_REAR_BATTERY, unexpected_resets, protection_faults]
    positive_columns: [system_power_w, compute_rail_voltage_v, compute_rail_current_a]
    positive_deltas: [work_units_completed]
    zero_columns: [unexpected_resets, protection_faults]
    minimum_duration_s: 3600
  P11:
    required_columns: [elapsed_s, compute_rail_voltage_v, compute_rail_current_a, rail_droop_v, rail_recovered, peak_mode_active, work_units_completed, protection_faults]
    positive_columns: [compute_rail_voltage_v, compute_rail_current_a]
    positive_deltas: [work_units_completed]
    zero_columns: [protection_faults]
    one_columns: [rail_recovered, peak_mode_active]
  M20:
    required_columns: [elapsed_s, installed_bytes, usable_bytes, allocated_bytes, stream_copy_bytes_per_s, memory_errors, work_units_completed]
    positive_columns: [installed_bytes, usable_bytes, allocated_bytes]
    positive_deltas: [work_units_completed]
    zero_columns: [memory_errors]
    minimum_final: {installed_bytes: 128000000000, usable_bytes: 120000000000, allocated_bytes: 103079215104, stream_copy_bytes_per_s: 1}
    final_order: [[allocated_bytes, usable_bytes], [usable_bytes, installed_bytes]]
    analysis_artifacts_min: 1
  S30:
    required_columns: [elapsed_s, storage_capacity_bytes, storage_bytes_read, storage_bytes_written, storage_temperature_c, storage_errors]
    positive_columns: [storage_capacity_bytes]
    positive_deltas: [storage_bytes_read, storage_bytes_written]
    zero_columns: [storage_errors]
    minimum_final: {storage_capacity_bytes: 1000000000000}
  C40:
    required_columns: [elapsed_s, system_power_w, work_units_completed, display_frames, TC_REAR_SOC, TC_FRONT_SOC, TC_REAR_BATTERY, unexpected_resets]
    positive_columns: [system_power_w]
    positive_deltas: [work_units_completed, display_frames]
    zero_columns: [unexpected_resets]
    minimum_duration_s: 600
  T10:
    required_columns: [elapsed_s, system_power_w, work_units_completed, TC_REAR_SOC, TC_FRONT_SOC, TC_REAR_BATTERY, T_AMBIENT]
    positive_columns: [system_power_w]
    positive_deltas: [work_units_completed]
    minimum_duration_s: 3600
    minimum_columns: {T_AMBIENT: 23}
    maximum_columns: {T_AMBIENT: 27}
  T20:
    required_columns: [elapsed_s, system_power_w, work_units_completed, TC_REAR_SOC, TC_FRONT_SOC, TC_REAR_BATTERY, T_AMBIENT, throttle_state]
    positive_columns: [system_power_w]
    positive_deltas: [work_units_completed]
    minimum_duration_s: 3600
    observed_one_columns: [throttle_state]
    minimum_columns: {T_AMBIENT: 33}
    maximum_columns: {T_AMBIENT: 37}
  T30:
    required_columns: [elapsed_s, system_power_w, work_units_completed, TC_REAR_SOC, TC_FRONT_SOC, TC_REAR_BATTERY, TC_EDGE_LEFT, TC_EDGE_RIGHT, T_AMBIENT]
    positive_columns: [system_power_w]
    positive_deltas: [work_units_completed]
    minimum_duration_s: 3600
    minimum_columns: {T_AMBIENT: 23}
    maximum_columns: {T_AMBIENT: 27}
  B40:
    required_columns: [elapsed_s, state_of_charge_percent, battery_voltage_v, system_power_w, work_units_completed, TC_REAR_BATTERY]
    positive_columns: [battery_voltage_v, system_power_w]
    positive_deltas: [work_units_completed]
    negative_deltas: [state_of_charge_percent]
    minimum_duration_s: 600
    minimum_columns: {state_of_charge_percent: 0}
    maximum_columns: {state_of_charge_percent: 100}
  B50:
    required_columns: [elapsed_s, state_of_charge_percent, input_voltage_v, input_current_a, TC_REAR_BATTERY, charge_faults]
    positive_columns: [input_voltage_v, input_current_a]
    positive_deltas: [state_of_charge_percent]
    zero_columns: [charge_faults]
    minimum_duration_s: 600
    minimum_columns: {state_of_charge_percent: 0}
    maximum_columns: {state_of_charge_percent: 100}
    maximum_input_power_w: 30
  R50:
    required_columns: [elapsed_s, radio_enabled, radio_tx_bytes, radio_rx_bytes, radio_errors, system_power_w, work_units_completed]
    positive_columns: [system_power_w]
    positive_deltas: [radio_enabled, radio_tx_bytes, radio_rx_bytes, work_units_completed]
    minimum_duration_s: 600
  MC0:
    required_columns: [elapsed_s]
    analysis_artifacts_min: 1
    correlations_min: 4
