screen:
  assumed_nominal_package_clearance_mm: 1.0
  required_before_selection:
    - Orderable voice-enabled hardware and firmware variant with carrier support for approved markets.
    - Released land pattern, antenna, power transient, host, audio, and SIM design documents.
    - Supplier confirmation that the module is appropriate for the final handheld product and certification route.
    - Board placement, two antenna feeds, 3D stack, thermal, SAR, and coexistence review.
    - Measured calling, data, emergency behavior, and regulatory results on a serialized Slate unit.
