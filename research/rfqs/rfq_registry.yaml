common_requirements:
  - Identify public versus NDA-restricted claims.
  - Provide document identifiers, revisions, and dates for technical claims.
  - State sample, qualification, production, lifecycle, and end-of-life status.
  - State pricing assumptions, minimum order quantity, lead time, and geographic restrictions when available.
  - Identify deviations from the request rather than leaving fields ambiguous.
