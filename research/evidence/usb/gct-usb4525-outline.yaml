  caveat: The manufacturer drawing is referenced, not redistributed. Its 11.04 mm overall mounting span includes shell stakes; a rectangular CAD envelope overstates occupied volume. The public page and drawing disagree on mating cycles, so the lower drawing value is used pending reconciliation. The 0.80 mm offset is not evidence that a 0.8 mm Slate PCB footprint is qualified. USB 3.2 Gen 2 is not USB4.
