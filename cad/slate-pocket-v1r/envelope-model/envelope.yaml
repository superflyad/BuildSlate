placement_rules:
  - All rectangles must remain inside the internal boundary unless explicitly marked as an edge feature.
  - Rectangles on the same physical layer must not overlap unless an overlap waiver explains the assembly.
  - RF, camera, acoustic, connector, fastener, seal, and service keepouts take precedence over reference placements.
  - Raw cell geometry is not complete-pack geometry.
  - Overlay compatibility requires independent z-height, RF, thermal, and assembly review.
