<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">BuildSlate</title>
  <desc id="description">BuildSlate engineering model cover with a schematic, provisional phone assembly.</desc>
  <defs>
