name: Defect
description: Report a reproducible problem in a command, validator, generator, or viewer.
title: "[Defect] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, supplier confidential files, or security exploit details. See SECURITY.md for private reports."
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch and date.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, profile, and input paths.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
