    memory_type: LPDDR5X
    maximum_memory_gb: 128
    observed_oem_configuration:
      product: HP EliteBook 6 G2q 14
      product_sku: 'DZ1U2UA#ABA'
      platform_part: X2P-64-100
      memory_gb: 32
      placement: unspecified
      source:
        url: https://www.hp.com/us-en/shop/mdp/elitebook-6-series-14-inch-%28qualcomm%29-laptops-tab4-module4-elitebook6-14qualcomm
        source_type: oem_store_listing
        accessed: 2026-11-24
    memory_bus_width_bits: 128
    memory_transfer_rate_mt_s: 9523
    memory_bandwidth_gb_s: 152
    storage_interfaces: [dual_pcie_5_0, UFS_4_0]
    on_device_display: eDP_1_5
    public_sustained_power_w: null
    strengths:
      - Qualcomm lists a 128 GB controller ceiling and USB4 on this exact 10-core platform.
      - Fewer CPU cores than the X2 Elite Extreme create a separate power characterization path.
    blockers:
      - No reviewed 128 GB orderable configuration, package topology, or qualified memory parts.
      - Fewer cores do not establish lower sustained power; no 28 W Slate workload result is published.
      - The supported external X75 M.2 modem path is not a released Slate phone integration.
    disposition: parallel_128gb_supplier_rfi_not_selected
    source:
      url: https://www.qualcomm.com/content/dam/qcomm-martech/dm-assets/documents/Snapdragon-X2-Plus-Product-Brief.pdf
      source_type: manufacturer_product_brief
      accessed: 2026-11-24

