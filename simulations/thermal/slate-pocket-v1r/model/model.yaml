model_release_requirements:
  - Replace all null material, interface, and boundary properties with traceable sources.
  - Import released mechanical solids and ECAD copper/component geometry.
  - Map measured workload power and charging losses to physical sources.
  - Complete mesh, convergence, energy-balance, sensitivity, and peer reviews.
  - Correlate against instrumented hardware before using the model for design signoff.
