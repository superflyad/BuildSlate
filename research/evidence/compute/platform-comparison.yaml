metadata:
  evidence_type: public_primary_source_screen
  reviewed_on: 2026-11-24
  status: available_not_verified
  selection_metric: measured_workload_performance_per_watt

slate_targets:
  sustained_power_w: 28
  peak_power_w: 45
  npu_tops_aspirational: 100
  memory_gb_aspirational: 512
  memory_fallback_tiers_gb: [256, 128]

candidates:
  qualcomm_snapdragon_8_elite_gen_5:
    platform_class: flagship_mobile
    part_numbers: [SM8850-5-AC]
    modem_integration: integrated
    process_nm: 3
    memory_type: LPDDR5X
    maximum_memory_gb: 24
    memory_speed_mhz: 5300
    storage_interface: UFS_4_1
    public_npu_tops: null
    public_sustained_power_w: null
    strengths:
      - Mobile integration, cellular, Wi-Fi 7, Bluetooth 6.0, UWB, camera ISP, display, security, and UFS are integrated.
      - Public brief supports INT2, INT4, INT8, INT16, FP8, and FP16 AI precisions.
    blockers:
      - Public maximum memory is 24 GB, below every locked Slate memory tier.
      - Public brief does not provide sustained workload power, tokens per second, package drawing, or NPU TOPS.
    disposition: mobile_architecture_reference_not_memory_fit
    source:
      url: https://www.qualcomm.com/content/dam/qcomm-martech/dm-assets/documents/Snapdragon-8-Elite-Gen-5-SM8850-5-AC-Product-Brief.pdf
      source_type: manufacturer_product_brief
      accessed: 2026-11-24

  qualcomm_snapdragon_8_elite_gen_6:
    platform_class: flagship_mobile
    part_numbers: [SM8950]
    modem_integration: integrated
    process_nm: 2
    memory_type: LPDDR5X_or_LPDDR6
    maximum_memory_gb: 24
    storage_interface: UFS_5_0
    public_sustained_power_w: null
    blockers:
      - Public maximum memory is 24 GB, below the locked 128 GB fallback.
      - Public brief does not release the package, reference design, sustained power, or validated pocket thermal limits.
    disposition: mobile_architecture_reference_not_memory_fit
    source:
      url: https://www.qualcomm.com/content/dam/qcomm-martech/dm-assets/documents/Snapdragon-8-Elite-Gen-6-Product-Brief.pdf
      source_type: manufacturer_product_brief
      accessed: 2026-11-24

  qualcomm_snapdragon_8_elite_extreme_gen_6:
    platform_class: flagship_mobile
    part_numbers: [SM8975]
    modem_integration: integrated
    process_nm: 2
    memory_type: LPDDR5X_or_LPDDR6
    maximum_memory_gb: 24
    storage_interface: UFS_5_0
    public_sustained_power_w: null
    blockers:
      - Public maximum memory is 24 GB, below the locked 128 GB fallback.
      - Public brief does not release the package, reference design, sustained power, or validated pocket thermal limits.
    disposition: mobile_architecture_reference_not_memory_fit
    source:
