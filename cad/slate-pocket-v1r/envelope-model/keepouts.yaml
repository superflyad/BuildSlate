required_future_keepouts:
  - Display flex and driver.
  - Battery tabs, protection, swelling, puncture, and service isolation.
  - SoC, memory, PMIC, storage, shield cans, decoupling, and test points.
  - Antenna elements, feeds, matching networks, diversity spacing, and SAR zones.
  - Camera optics, sensor, actuator, cover glass, calibration, and flex.
  - Speakers, microphones, ports, buttons, haptics, seals, fasteners, and adhesives.
  - Wireless charging alignment, ferrite, foreign-object detection, and magnet zones.
