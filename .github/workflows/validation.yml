name: BuildSlate validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/ci_validate.py
      - name: Diagnose deterministic-state failure
        if: failure()
        run: |
          python -m buildslate stale --format yaml || true
          git status --short
          git diff --stat

  cad-export:
    name: Editable concept CAD / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-cad.txt
      - run: npm ci --prefix viewer
      - run: python -m buildslate.cad
      - run: python scripts/check_cad_proof_geometry.py
      - run: python -m buildslate.mechanical_proof --write
      - run: python scripts/check_mechanical_proof_geometry.py
      - run: python validation/validate_concept_cad.py
      - run: python validation/validate_mechanical_proof.py
      - run: npm run check:model --prefix viewer
      # CadQuery tessellation can differ by platform; check mesh identities and bounds above.
      - run: git diff --exit-code -- viewer/public/concept.json viewer/public/proof.json viewer/public/memory-8x16.json viewer/public/memory-8x16-proof.json cad/slate-pocket-v1r/concept-cad/memory-8x16.step viewer/public/memory-8x16-compact.json viewer/public/memory-8x16-compact-proof.json cad/slate-pocket-v1r/concept-cad/memory-8x16-compact.step viewer/public/phone-fit-conflict.json viewer/public/phone-fit-conflict-proof.json cad/slate-pocket-v1r/concept-cad/phone-fit-conflict.step viewer/public/usb4525-outline.json viewer/public/usb4525-outline-proof.json cad/slate-pocket-v1r/concept-cad/usb4525-outline.step viewer/public/lp4473109-pack-outline.json viewer/public/lp4473109-pack-outline-proof.json cad/slate-pocket-v1r/concept-cad/lp4473109-pack-outline.step viewer/public/mechanical-proof.json

  deploy:
    name: Publish viewer to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, cad-export]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --prefix viewer
      - run: npm run build:pages --prefix viewer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist
      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            visible="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts | any(.name == "github-pages" and .expired == false)' || true)"
            if [[ "$visible" == "true" ]]; then
              # The deploy action can read a different artifact index shortly after upload.
              sleep 15
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact did not become visible within 60 seconds" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4

