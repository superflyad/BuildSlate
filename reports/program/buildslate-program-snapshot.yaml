  title: supplier responses
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: supplier_and_nda
    missing_evidence: Completed supplier response templates, controlled drawings, limits, lifecycle/availability, sample terms,
