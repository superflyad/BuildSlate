metadata:
  status: planned_requirements_pending
  caveat: Exact stresses, sample sizes, sequences, and acceptance limits require approved use/environment requirements and qualified-lab review.

sample_control:
  rules:
    - Record unit genealogy, prior stresses, configuration, preconditioning, calibration, and baseline inspection.
    - Do not reuse units across incompatible tests without an approved sequence and attribution plan.
    - Preserve failed units for nondestructive inspection and failure analysis before teardown.

test_families:
  mechanical:
    cases: [controlled_drop_by_orientation, torsion_and_bend, localized_load, vibration, mechanical_shock, button_and_connector_cycles, cable_side_load]
    focus: [structure, display_and_rear_bonds, battery_protection, solder_and_connectors, cameras, antennas, seals, cosmetics]
  environmental:
    cases: [temperature_cycle, thermal_shock_if_required, high_temperature_storage, low_temperature_operation, humidity_bias, condensation_control, altitude_if_required]
    focus: [CTE_mismatch, adhesives, corrosion, battery, seals, display, sensors, clocks, calibration]
  powered_life:
    cases: [sustained_workload_cycles, charge_discharge_cycles, power_state_cycles, storage_endurance, radio_coexistence, hot_ambient_control_cycles]
    focus: [degradation, throttling, drift, intermittent_faults, connectors, protection, thermal_interfaces]
  ingress_and_contamination:
    cases: [dust_preconditioning_if_required, water_pretest_if_rating_retained, sweat_and_skin_oil, cleaning_chemicals, foreign_material]
    focus: [seal_paths, ports, speakers, buttons, adhesives, corrosion, service_openings]
  electrostatic_and_electrical:
    cases: [ESD_pretest, cable_hot_plug, charger_variants, brownout_and_handoff, protection_faults]
    focus: [damage, reset, latchup, data_loss, unsafe_charge_state, radio_or_sensor_fault]

failure_rules:
  - Safety-critical failure stops the affected test family and triggers containment.
  - Functional intermittents, no-trouble-found, and recovered resets remain failures until root cause/disposition is reviewed.
  - Passing after rework does not erase the original failure from reliability or yield records.
  - Requirement changes after failure follow baseline change control and require affected tests to be rerun.

required_outputs: [test_plan_revision, unit_allocation, raw_data, pre_and_post_inspection, failures, failure_analysis, corrective_actions, rerun_results, residual_risk, signoff]
