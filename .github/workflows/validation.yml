name: BuildSlate validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/ci_validate.py
      - name: Diagnose deterministic-state failure
        if: failure()
        run: |
          python -m buildslate stale --format yaml || true
          git status --short
          git diff --stat

  cad-export:
    name: Editable concept CAD / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-cad.txt
      - run: npm ci --prefix viewer
      - run: python -m buildslate.cad
      - run: python scripts/check_cad_proof_geometry.py
      - run: python validation/validate_concept_cad.py
      - run: npm run check:model --prefix viewer
      - run: git diff --exit-code -- viewer/public/concept.json viewer/public/proof.json

  deploy:
    name: Publish viewer to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, cad-export]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --prefix viewer
      - run: npm run build:pages --prefix viewer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4

