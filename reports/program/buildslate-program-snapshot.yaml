- entity_id: blocker:accredited_labs_and_compliance_scope
  kind: blocker
  title: accredited labs and compliance scope
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: laboratory_and_regulatory
    missing_evidence: Market/SKU matrix, current lab scope, calibrated tests, accredited reports, certifications/declarations/filings.
    exact_request: Select target markets/configurations and engage qualified labs/regulatory counsel after production-intent
      hardware exists.
    acceptance_criteria: All required configurations and claims have passing traceable evidence and completed approvals.
    fallback: Defer cellular, remove wireless charging, limit claims/markets, and retain modular development radios.
    authorization_required: market_decisions_lab_contracts_and_test_samples
- entity_id: blocker:battery_pack_and_charge_limits
  kind: blocker
  title: battery pack and charge limits
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: supplier_safety
    missing_evidence: Complete-pack CAD, swelling/tolerances, protection, charge/discharge curves, temperature/cycle limits,
      safety and shipping documentation.
    exact_request: Request a supplier-proposed pack fitting the RFQ envelope and validated charger/system limits; do not prescribe
      unsupported capacity or charge rate.
    acceptance_criteria: Pack-backed capacity/energy/geometry and safe current/temperature limits close CAD, power, and EVT
      hard stops.
    fallback: Use the best supplier-validated capacity fitting the envelope; cap wired charge below 30 W if required; wireless
      remains removed.
    authorization_required: supplier_contact_samples_and_purchases
- entity_id: blocker:display_storage_drawings
  kind: blocker
  title: display storage drawings
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: supplier_engineering
    missing_evidence: Selected display module drawing/flex/power and selected storage package/host/power/thermal/lifecycle
      evidence.
    exact_request: Run prepared display and storage RFIs; request EVT-available modules and complete response schemas.
    acceptance_criteria: A panel preserves workspace intent and fits; one TB storage is host-qualified, with a verified path
      toward the 2 TB product fallback.
    fallback: Allow supplier-available 7–8.4 inch display variation and modular/external storage; 4 TB internal stays rejected.
    authorization_required: supplier_contact_samples_and_purchases
- entity_id: blocker:evt0_build_and_measurement
  kind: blocker
  title: evt0 build and measurement
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: physical_work
    missing_evidence: Selected BOM, released designs, authorized build, calibrated setup, raw results, deviations, and correlated
      models.
    exact_request: Authorize procurement/build/energized testing only after the EVT0 prerequisite and safety gates pass.
    acceptance_criteria: Every required EVT0 test has schema-valid raw data and reviewed disposition; correlation gates pass
      or trades are approved.
    fallback: Continue workload characterization on external developer hardware without claiming integrated prototype performance.
    authorization_required: purchases_physical_build_and_energized_testing
- entity_id: blocker:platform_reference_design
  kind: blocker
  title: platform reference design
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: supplier_confidential_engineering
    missing_evidence: Package/ball maps, qualified 128 GB topology, PMIC/rails, reference schematic, power/load steps, software
      access, and sustained workload telemetry.
    exact_request: Obtain the selected platform's NDA-controlled design package and evaluation access for the 128 GB fallback.
    acceptance_criteria: Topology, routing, power, software, thermal, sourcing, and measured workload evidence satisfy the
      package criteria.
    fallback: Use external 128 GB developer systems for workload characterization only; do not claim pocket integration.
    authorization_required: supplier_contact_NDA_eval_hardware_and_licenses
- entity_id: blocker:released_integration_design
  kind: blocker
  title: released integration design
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: engineering_and_paid_tools
    missing_evidence: Released 3D CAD, tolerance/mass/interference review, schematic/netlist/routed ECAD, solver model, EM
      model, and peer signoff.
    exact_request: After supplier packages are verified, authorize detailed CAD/ECAD/solver work and any required paid tools
      or contractors.
    acceptance_criteria: All Phase 2 acceptance criteria pass with selected-component geometry/properties and reviewed analyses.
    fallback: Preserve provisional blocking models and 10.2 mm first thickness fallback; do not release hardware.
    authorization_required: design_release_paid_tools_and_external_engineering_if_needed
- entity_id: blocker:supplier_dfm_and_pilot
  kind: blocker
  title: supplier dfm and pilot
  status: external
  source_path: engineering/evidence/external_blocker_registry.yaml
  attributes:
    category: manufacturing_physical_work
    missing_evidence: Completed supplier DFM responses, released process/tooling, pilot authorization, 100-unit records, yield/capability,
      reliability, compliance, and service results.
    exact_request: After verified EVT0, authorize supplier DFM and then the controlled pilot only when G0/G1 pass.
    acceptance_criteria: Supplier comments close and manufacturing gates G0–G4 meet their evidence requirements with zero
      critical defects.
    fallback: Hold production claims and iterate EVT/design/process; do not shrink denominators or hide rework/failures.
    authorization_required: supplier_engagement_tooling_materials_pilot_and_labs
- entity_id: blocker:supplier_responses
