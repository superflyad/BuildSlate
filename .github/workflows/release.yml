name: BuildSlate release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes-file .git/release-notes.md
      - run: python scripts/ci_validate.py
      - run: python -m build
      - name: Archive viewer
        run: |
          cd viewer/dist
          zip -q -r ../../dist/buildslate-viewer-${GITHUB_REF_NAME#v}.zip .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "BuildSlate $GITHUB_REF_NAME" --notes-file .git/release-notes.md --verify-tag
